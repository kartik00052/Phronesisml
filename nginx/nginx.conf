# Nginx: single-origin production serving for PhronesisML.
#
# Browser → Nginx :80
#   /api/*            → FastAPI backend :8000 (HTTP + WebSocket)
#   everything else   → React static files (Vite production build)
#
# The WebSocket endpoint lives under the API prefix at
# `/api/v1/ws/runs/{run_id}` (backend/app/api/v1/ws.py), so the `/api/`
# location below carries the standard upgrade headers and covers it.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # WebSocket upgrade: "upgrade" for Upgrade requests, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Must match backend MAX_UPLOAD_SIZE_MB (default 2048 MiB) so dataset
    # uploads are not rejected by the proxy before reaching FastAPI.
    client_max_body_size 2048m;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # SPA fallback: let React Router handle client-side routes on refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}