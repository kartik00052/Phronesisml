[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phronesisml"
dynamic = ["version"]
description = "Open-source Python SDK that automates the complete ML lifecycle using a modular multi-agent architecture orchestrated by LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Kartik Sharma", email = "kartiksharma18852@gmail.com" }]
keywords = ["machine-learning", "automl", "mlops", "langgraph", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "langgraph>=0.2,<1.0",
    "pandas>=2.0,<3.0",
    "polars>=1.0,<2.0",
    "scikit-learn>=1.3,<2.0",
    "numpy>=1.24,<2.5",
    "shap>=0.51,<0.53",
    "pyarrow>=15.0",
    "joblib>=1.3,<2.0",
]

[project.urls]
Homepage = "https://github.com/kartik00052/PhronesisML"
Repository = "https://github.com/kartik00052/PhronesisML"
Issues = "https://github.com/kartik00052/PhronesisML/issues"
Changelog = "https://github.com/kartik00052/PhronesisML/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["typer>=0.12,<1.0", "rich>=13.0,<16.0"]
spark = ["pyspark>=3.5,<4.0"]
mlflow = ["mlflow>=2.10,<3.0"]
excel = ["openpyxl>=3.1,<4.0"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocstrings[python]>=0.25,<1.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "coverage>=7.0,<8.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.0,<5.0",
    "build>=1.2,<2.0",
    "twine>=5.0,<7.0",
]
all = [
    "phronesisml[cli,spark,mlflow,excel,docs]",
]

[tool.hatch.version]
path = "phronesisml/__init__.py"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

# sdist carries only the Python package + license; docs, CI, project
# planning docs, datasets, and pip-compat requirements are development
# concerns and intentionally excluded from the published distribution.
[tool.hatch.build.targets.sdist]
exclude = [
    "*.csv",
    "*.xlsx",
    "tests/",
    "test*.py",
    "benchmarks/",
    "project_docs/",
    ".github/",
    "docs/",
    "mkdocs.yml",
    "Makefile",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".gitignore",
    "profile_sdk.py",
    "requirements.txt",
    "assets/",
    "Phronesis_artifacts/",
    "qa_artifacts/",
    "uv.lock",
    ".python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["phronesisml"]
artifacts = ["phronesisml/py.typed"]

[project.scripts]
phronesisml = "phronesisml.interfaces.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "N812", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "B017", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "phronesisml.interfaces.cli.*",
]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
