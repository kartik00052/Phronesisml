[alembic]
# Alembic configuration for the PhronesisML web backend.
# The target URL is pulled from the backend Settings at runtime (see
# backend/alembic/env.py), so DATABASE_URL env overrides are respected.
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/phronesisml.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S