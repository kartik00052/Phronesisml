name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  # ── Auto-format: runs on PRs, commits fixes back to the branch ──
  auto-format:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      !contains(github.event.head_commit.message, 'style: auto-format via Ruff')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - name: Run ruff fix + format
        run: |
          ruff check phronesisml/ --fix
          ruff format phronesisml/
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: auto-format via Ruff"
            git push
          else
            echo "No formatting changes to commit."
          fi

  # ── Lint: always runs, fails if code is not clean ───────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check phronesisml/ --no-fix
      - run: ruff format --check phronesisml/
      - name: Validate uv.lock (cross-platform)
        uses: astral-sh/setup-uv@v5
      - run: uv lock --check

  # ── Tests: dual pip + uv legs on 3.11/3.12/3.13 ────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        install: ["pip", "uv"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with uv (locked)
        uses: astral-sh/setup-uv@v5
        if: matrix.install == 'uv'
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
        if: matrix.install == 'uv'
      - name: Run unit tests (uv)
        if: matrix.install == 'uv'
        run: uv run pytest tests/ -v --tb=short -x
      - run: pip install -e ".[dev]"
        if: matrix.install == 'pip'
      - name: Run unit tests (pip)
        if: matrix.install == 'pip'
        run: pytest tests/ -v --tb=short -x
      - name: Run regression tests (uv)
        if: matrix.install == 'uv'
        run: uv run python test_phronesis.py 2>&1 || true
      - name: Run regression tests (pip)
        if: matrix.install == 'pip'
        run: python test_phronesis.py 2>&1 || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy phronesisml/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v5
      - run: pip install build twine
      - name: Build with pip (python -m build)
        run: python -m build
      - name: Build with uv (uv build)
        run: uv build
      - name: Verify artifacts (twine check)
        run: twine check dist/*
      - name: Import smoke test from built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/phronesisml-*.whl
          python -c "import phronesisml; print(phronesisml.__version__)"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
