# PhronesisML - Render blueprint configuration (backend web service only).
#
# Deploys the FastAPI backend image (./Dockerfile) that already binds to
# $PORT. This blueprint is tuned for the no-auth prototype demo:
#
#   - AUTH_MODE=disabled: no login, no Supabase, no JWT. Every request uses
#     the single-tenant local-dev identity. Do not expose private data.
#   - DATABASE_URL is pinned to SQLite so a stale Supabase/Postgres URL left
#     in the Render dashboard cannot break startup.
#   - plan: free  (Free instances cannot attach persistent disks)
#   - storage is EPHEMERAL - uploads/models are wiped whenever the instance
#     spins down or redeploys. Bundled sample datasets ship in the image (see
#     .dockerignore) and are re-seeded on every fresh start.
#   - healthCheckPath keeps Render's health monitor pinned to the real route.
#
# Companion files: frontend/vercel.json (Vercel), project_docs/deployment.md.

services:
  - type: web
    name: phronesisml-backend
    runtime: docker
    repo: https://github.com/kartik00052/Phronesisml.git
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: AUTH_MODE
        value: disabled
      - key: DATABASE_URL
        value: sqlite:////app/data/phronesisml.db
      - key: SEED_SAMPLE_DATASETS
        value: "1"
      # Comma-separated browser origins that may call this API - set to the
      # real Vercel frontend origin (e.g. https://app.vercel.app). Leave for
      # the dashboard; never guess the URL here.
      - key: CORS_ORIGINS
        sync: false
    # Uncomment ONLY on a paid plan that supports disks (Starter+), then the
    # four storage subdirectories under /app/storage become durable:
    # disks:
    #   - name: phronesisml-storage
    #     mountPath: /app/storage
    #     sizeGB: 10
